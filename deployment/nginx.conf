server {
    listen 80;
    server_name localhost;

    # Static Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to Python API
    location /py/ {
        rewrite ^/py/(.*) /$1 break;
        proxy_pass http://backend-python:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse proxy to Go API
    location /go/ {
        rewrite ^/go/(.*) /$1 break;
        proxy_pass http://backend-go:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
