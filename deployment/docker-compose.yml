version: '3.8'

services:
  # Python FastAPI Microservice
  backend-python:
    build:
      context: ../backend-python
      dockerfile: Dockerfile
    container_name: url_shortener_python
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  # Go HTTP Microservice
  backend-go:
    build:
      context: ../backend-go
      dockerfile: Dockerfile
    container_name: url_shortener_go
    ports:
      - "8080:8080"
    restart: unless-stopped

  # High-speed Redis Cache Layer
  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  # Web Dashboard & Reverse Proxy (Nginx)
  web-proxy:
    image: nginx:alpine
    container_name: url_shortener_proxy
    ports:
      - "3000:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-python
      - backend-go
    restart: unless-stopped
